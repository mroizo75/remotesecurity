<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Shield icon -->
  <g transform="translate(100, 150)">
    <path d="M50 10L80 25V55C80 70 65 85 50 90C35 85 20 70 20 55V25L50 10Z" fill="rgba(255,255,255,0.9)" stroke="#22c55e" stroke-width="3"/>
    <circle cx="50" cy="45" r="15" fill="#22c55e"/>
    <path d="M45 45L48 48L55 41" stroke="white" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Main title -->
  <text x="250" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#text)">
    Remote Secure Systems
  </text>
  
  <!-- Subtitle -->
  <text x="250" y="250" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.9)">
    AI-Powered Threat Detection Network
  </text>
  
  <!-- Description -->
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.8)">
    Military-grade security solutions for events, installations, and critical infrastructure
  </text>
  
  <!-- Features -->
  <g transform="translate(250, 350)">
    <circle cx="10" cy="10" r="5" fill="#22c55e"/>
    <text x="25" y="15" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.9)">AI Detection</text>
    
    <circle cx="10" cy="35" r="5" fill="#22c55e"/>
    <text x="25" y="40" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.9)">Drone Networks</text>
    
    <circle cx="10" cy="60" r="5" fill="#22c55e"/>
    <text x="25" y="65" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.9)">Real-time Monitoring</text>
  </g>
  
  <!-- Location -->
  <text x="250" y="480" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)">
    Kongsberg, Norway
  </text>
  
  <!-- Website URL -->
  <text x="250" y="520" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)">
    remotesecuresystems.com
  </text>
</svg>
